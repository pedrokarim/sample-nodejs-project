# Clé du projet SonarQube (doit correspondre au projet créé dans SonarQube)
sonar.projectKey=sample-nodejs-project

# Nom affiché dans SonarQube
sonar.projectName=sample-nodejs-project

# Répertoires de base — on pointe directement sur les dossiers de code source
# pour éviter que le scanner ne traverse node_modules (48k+ fichiers)
sonar.sources=backend/server.js,backend/routes,frontend/src,frontend/public

# Inclusions par type de fichier (les sources sont déjà ciblées, pas besoin de chemins complets)
sonar.inclusions=**/*.js,**/*.jsx,**/*.css,**/*.html

# Exclusions : fichiers de test uniquement (node_modules n'est plus traversé)
sonar.exclusions=**/*.test.js,**/*.spec.js

# Rapports de couverture (optionnel)
# sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
