# Clé du projet SonarQube (doit correspondre au projet créé dans SonarQube)
sonar.projectKey=sample-nodejs-project

# Nom affiché dans SonarQube
sonar.projectName=sample-nodejs-project

# Répertoires sources (backend + frontend)
sonar.sources=backend,frontend

# Exclusions : ne pas analyser dépendances et artefacts de build
sonar.exclusions=**/node_modules/**,**/coverage/**,**/build/**,**/dist/**,**/*.test.js,**/*.spec.js

# Rapports de couverture (optionnel, si tu génères lcov)
# sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
